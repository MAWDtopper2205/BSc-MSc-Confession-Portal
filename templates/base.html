<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BSc-MSc Confession Portal{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="nav">
  <a class="brand" href="/">BSc-MSc <span>CONFESSION PORTAL</span></a>
  <div class="nav-right">
    {% if user %}
      <span class="nav-user">{{ user.name }}</span>
      <form class="inline" action="/logout" method="post"><button class="navlink">Logout</button></form>
    {% else %}
      <a href="/login">Login</a>
      <a href="/register">Register</a>
    {% endif %}
  </div>
</nav>
<main class="wrap">{% block content %}{% endblock %}</main>
<footer>Don't keep it lighthearted and respectful. Please post private information or humiliating content.</footer>
</body>
</html>
